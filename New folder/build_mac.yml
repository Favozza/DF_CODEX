name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & PyInstaller
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt (uncomment if you have a requirements file)

      - name: Build macOS Executable
        run: |
          pyinstaller --onefile --noconsole --add-data "df_codexlogo.ico:." --add-data "language_*.txt:." --add-data "synonyms.txt.gz:." df_codex.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: dist/*
